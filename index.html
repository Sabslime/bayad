<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EA; --surface:#F9FBF7; --ink:#1D3327; --muted:#5C7064; --line:#CAD5CB;
  --accent:#2F6B4A; --accent-ink:#F4F8F2; --brass:#94661C; --brass-bg:#F3E8D2; --brass-line:#DCC49A;
  --danger:#AE3F2B; --danger-bg:#F6E1DB; --ok:#2F7A4F;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C16; --surface:#162820; --ink:#E3ECE5; --muted:#92A79A; --line:#284437;
    --accent:#72B48E; --accent-ink:#0F1C16; --brass:#DBA852; --brass-bg:#2A2416; --brass-line:#4A3D22;
    --danger:#E57A63; --danger-bg:#3A1F19; --ok:#72B48E; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C16; --surface:#162820; --ink:#E3ECE5; --muted:#92A79A; --line:#284437;
  --accent:#72B48E; --accent-ink:#0F1C16; --brass:#DBA852; --brass-bg:#2A2416; --brass-line:#4A3D22;
  --danger:#E57A63; --danger-bg:#3A1F19; --ok:#72B48E; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 14px}
header.top h1{font:700 26px/1 var(--display);letter-spacing:-.02em;margin:0}
.sync{font-size:12px;color:var(--muted)}
.ver{font:600 11px/1 var(--body);letter-spacing:0;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin-left:8px;vertical-align:4px}
.hdr-r{display:flex;align-items:center;gap:4px}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
h2{font:600 19px/1.2 var(--display);margin:26px 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}

/* The stub: next payment as a tear-off bill */
.stub{display:grid;grid-template-columns:1fr auto;background:var(--accent);color:var(--accent-ink);border-radius:14px;position:relative;overflow:hidden}
.stub.over{background:var(--danger);color:#fff}
.stub .l{padding:18px 18px 16px}
.stub .r{padding:18px 18px 16px 20px;border-left:2px dashed color-mix(in srgb, currentColor 40%, transparent);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right}
.stub::before,.stub::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--bg);right:var(--notch,120px);transform:translateX(50%)}
.stub::before{top:-9px}.stub::after{bottom:-9px}
.stub .when{font-size:13px;opacity:.85}
.stub .name{font:600 20px/1.2 var(--display);margin:4px 0 2px}
.stub .amt{font:700 30px/1 var(--display);letter-spacing:-.02em}
.stub button{margin-top:14px;background:color-mix(in srgb, currentColor 16%, transparent);border:0;color:inherit;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px}
.stub.multi{grid-template-columns:1fr}
.stub.multi::before{top:86px;left:-9px;right:auto;transform:none}
.stub.multi::after{top:86px;bottom:auto;right:-9px;transform:none}
.stub.multi .hd{height:95px;padding:16px 18px 0;display:flex;justify-content:space-between;gap:12px;border-bottom:2px dashed color-mix(in srgb, currentColor 40%, transparent)}
.stub.multi .hd .amt{align-self:center}
.stub.multi .items{padding:6px 18px 16px}
.stub.multi .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb, currentColor 18%, transparent)}
.stub.multi .it .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stub.multi .it .n small{display:block;font-weight:400;opacity:.8;font-size:12px}
.stub.multi .it button{margin:0;padding:5px 10px;font-size:13px}
.stub.multi .all{width:100%;margin-top:12px}
.stub.empty{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:600 20px/1.2 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats.three .stat b{font-size:16px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.flow .top{font-size:13px;color:var(--muted);margin-bottom:6px}
.flow .fl{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.flow .fl span{color:var(--muted)}
.flow .fl.total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;align-items:baseline}
.flow .fl.total span{color:var(--ink);font-weight:600}
.flow .fl.total b{font:700 26px/1 var(--display);letter-spacing:-.02em}
.flow .foot{font-size:13px;color:var(--muted);margin-top:10px}
.neg{color:var(--danger)}
.toggle{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--muted)}
.row .d.over{color:var(--danger);font-weight:600}
.row .a{font-weight:600;white-space:nowrap}
.row.paid .t,.row.paid .a{color:var(--muted);text-decoration:line-through}
.row.tap{cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.empty-note{padding:18px 14px;color:var(--muted);font-size:14px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head h2{margin-bottom:10px}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:5px;background:var(--bg);color:var(--muted);margin-left:6px;vertical-align:1px;font-weight:500}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.monthnav b{font:600 19px var(--display)}
.cats .row{display:block}
.cats .row .line1{display:flex;justify-content:space-between;font-size:14px}

/* Work fund: its own paper, kept apart */
.fund{background:var(--brass-bg);border:1px solid var(--brass-line);border-radius:14px;padding:16px 18px}
.fund .lbl{font-size:13px;color:var(--brass);font-weight:600}
.fund .big{font:700 32px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 2px}
.fund .bar{background:color-mix(in srgb, var(--brass) 22%, transparent)}
.fund .bar i{background:var(--brass)}
.fund .warn{color:var(--danger);font-weight:600;font-size:14px;margin-top:8px}
.fund .btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--brass-line);background:var(--surface);padding:6px 12px;border-radius:999px;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--brass-bg);border-color:var(--brass);font-weight:600}
.worknote{font-size:13px;color:var(--muted);margin:0 0 12px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;font-size:12px;color:var(--muted);font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs button.work[aria-current="page"]{color:var(--brass)}

dialog{border:0;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:560px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(10,20,15,.45)}
dialog form{padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
dialog h3{font:600 20px var(--display);margin:0 0 14px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg label{text-align:center;padding:9px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.btns{display:flex;gap:6px;flex:none}
.row.done .t{color:var(--muted)}
.payhist .row{padding:8px 0;border-color:var(--line)}
.formrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.formrow .left{margin-right:auto}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.update{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:30;font-size:14px}
.update button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:7px 12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
<meta name="bayad-version" content="2.1">
<meta name="theme-color" content="#2F6B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bayad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
<div class="wrap">
  <header class="top"><h1><span aria-hidden="true" style="font-size:.9em;margin-right:6px">🐷</span>Bayad<span class="ver" id="ver">v2.1</span></h1><div class="hdr-r"><span class="sync" id="sync">Saved on this phone</span><button class="btn small ghost" data-act="backup">Backup</button></div></header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>Home</button>
  <button data-act="tab" data-v="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Expenses</button>
  <button data-act="tab" data-v="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bills</button>
  <button data-act="tab" data-v="owed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 11h6M19 8v6"/></svg>Owed</button>
  <button data-act="tab" data-v="work" class="work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/></svg>Work fund</button>
</div></nav>
<dialog id="sheet"><form id="sheetForm"></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso = n => "₱" + (Number(n)||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const dim = (y,m) => new Date(y,m+1,0).getDate();
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TODAY = () => ymd(new Date());
const fmtDate = s => parse(s).toLocaleDateString("en-PH",{month:"short",day:"numeric"});
const fmtMonth = ym => parse(ym+"-01").toLocaleDateString("en-PH",{month:"long",year:"numeric"});
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
function relDue(s){
  const n = daysBetween(TODAY(), s);
  if (n === 0) return "Due today";
  if (n === 1) return "Due tomorrow";
  if (n > 1) return "Due in "+n+" days";
  return (-n)+(n===-1?" day":" days")+" overdue";
}
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
const CATS = ["Food","Transport","Bills","Loan","Household","Load & internet","Health","Personal","Other"];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ---------- state ---------- */
let S = null;
let tab = "home";
let expMonth = TODAY().slice(0,7);
let expMode = "cut";
let expCut = null;
// Bills due before this date count as already settled (so old loan payments don't pile up as overdue).
function latest20(){ const d = new Date(); return ymd(new Date(d.getFullYear(), d.getMonth() - (d.getDate() < 20 ? 1 : 0), 20)); }
function normalize(s){
  s = s && typeof s === "object" ? s : {};
  return {expenses:Array.isArray(s.expenses)?s.expenses:[], bills:Array.isArray(s.bills)?s.bills.map(b=>({...b,paid:b.paid||{}})):[], funds:Array.isArray(s.funds)?s.funds.map(f=>({...f,entries:f.entries||[]})):[], activeFund:s.activeFund||null, salary: s.salary && typeof s.salary==="object" ? {a5:Number(s.salary.a5)||0, a20:Number(s.salary.a20)||0, overrides:s.salary.overrides||{}} : null, debts:Array.isArray(s.debts)?s.debts.map(d=>({...d,payments:Array.isArray(d.payments)?d.payments:[]})):[], trackFrom: /^\d{4}-\d{2}-\d{2}$/.test(s.trackFrom||"") ? s.trackFrom : latest20()};
}
try { const raw = localStorage.getItem("bayad-state"); if (raw) S = normalize(JSON.parse(raw)); } catch(e){}
if (!S) S = normalize({});

/* ---------- scheduling ---------- */
function occurrences(b, until){
  const out = [];
  const max = b.kind === "loan" && b.terms ? Number(b.terms) : Infinity;
  const s = parse(b.start);
  if (b.freq === "once") return b.start <= until ? [b.start] : [];
  if (b.freq === "weekly"){
    let d = b.start, i = 0;
    while (d <= until && out.length < max && i++ < 800){ out.push(d); d = addDays(d,7); }
    return out;
  }
  const days = b.freq === "semi" ? [Number(b.day), Number(b.day2)].filter(Boolean).sort((a,c)=>a-c) : [Number(b.day) || s.getDate()];
  for (let i = 0; i < 400; i++){
    const base = new Date(s.getFullYear(), s.getMonth()+i, 1);
    const y = base.getFullYear(), m = base.getMonth();
    let stop = false;
    for (const dd of [...new Set(days)]){
      const date = ymd(new Date(y, m, Math.min(dd, dim(y,m))));
      if (date < b.start) continue;
      if (date > until || out.length >= max){ stop = true; break; }
      out.push(date);
    }
    if (stop) break;
  }
  return out;
}
function schedule(until, includePaid){
  const items = [];
  for (const b of S.bills){
    const lim = b.kind === "loan" && b.terms ? "9999-12-31" : until;
    for (const due of occurrences(b, lim)){
      if (due > until) break;
      if (due < S.trackFrom) continue;
      const paid = !!b.paid[due];
      if (!paid || includePaid) items.push({b, due, paid});
    }
  }
  return items.sort((x,y)=> x.due.localeCompare(y.due) || x.b.name.localeCompare(y.b.name));
}
function loanInfo(b){
  const all = occurrences(b, "9999-12-31");
  const settled = d => d < S.trackFrom || !!b.paid[d];
  const paidN = all.filter(settled).length;
  const terms = all.length;
  return {terms, paidN, remaining:(terms-paidN)*Number(b.amount), total:terms*Number(b.amount), last:all[all.length-1], next:all.find(d=>!settled(d))};
}
function freqText(b){
  if (b.freq === "once") return "One-time, "+fmtDate(b.start);
  if (b.freq === "weekly") return "Every "+WEEKDAYS[parse(b.start).getDay()];
  if (b.freq === "semi") return "Twice a month, "+ordinal(b.day)+" & "+ordinal(b.day2);
  return "Monthly on the "+ordinal(b.day || parse(b.start).getDate());
}

/* ---------- paydays: 5th and 20th ---------- */
function periodOf(s){
  const d = parse(s), y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  const start = day >= 20 ? new Date(y,m,20) : day >= 5 ? new Date(y,m,5) : new Date(y,m-1,20);
  const end = start.getDate() === 5 ? new Date(start.getFullYear(), start.getMonth(), 19) : new Date(start.getFullYear(), start.getMonth()+1, 4);
  return {start:ymd(start), end:ymd(end)};
}
const nextPeriod = p => periodOf(addDays(p.end,1));
const prevPeriod = p => periodOf(addDays(p.start,-1));
const payLabel = p => ordinal(parse(p.start).getDate())+" pay";
const rangeLabel = p => fmtDate(p.start)+" to "+fmtDate(p.end);
function payAmt(start){
  if (!S.salary) return 0;
  if (start < periodOf(S.trackFrom).start) return 0; // paydays before tracking starts are already spent
  const o = S.salary.overrides[start];
  if (o !== undefined && o !== null && o !== "") return Number(o);
  return parse(start).getDate() === 5 ? S.salary.a5 : S.salary.a20;
}
function flow(p, current){
  const salary = payAmt(p.start);
  const spent = S.expenses.filter(e=>e.date>=p.start && e.date<=p.end).reduce((a,e)=>a+Number(e.amount),0);
  const dueItems = schedule(p.end,false).filter(x => current || x.due >= p.start);
  const due = dueItems.reduce((a,x)=>a+Number(x.b.amount),0);
  return {salary, spent, due, dueN:dueItems.length, left: salary - spent - due, adjusted: S.salary && S.salary.overrides[p.start] !== undefined};
}
function payOptions(){
  const t = TODAY(), cur = periodOf(t).start;
  let p = periodOf(t); for (let i = 0; i < 2; i++) p = prevPeriod(p);
  const opts = [];
  for (let i = 0; i < 6; i++){ opts.push(p.start); p = nextPeriod(p); }
  if (!opts.includes(S.trackFrom)) opts.push(S.trackFrom);
  const next = nextPeriod(periodOf(t)).start;
  return opts.sort().map(s => `<option value="${s}" ${s===S.trackFrom?"selected":""}>${fmtDate(s)}, ${parse(s).getFullYear()} pay${s===cur?" (latest)":s===next?" (next)":""}</option>`).join("");
}
function flowCard(){
  const t = TODAY(), started = S.trackFrom <= t;
  const p = periodOf(started ? t : S.trackFrom), f = flow(p, started), np = nextPeriod(p), nf = flow(np, false);
  const used = f.salary ? Math.min(100, (f.spent+f.due)/f.salary*100) : 0;
  const days = daysBetween(t, np.start);
  return `<div class="head"><h2>${started?"This cutoff":"First cutoff"}</h2><button class="btn small ghost" data-act="salary">Edit salary</button></div>
  <div class="flow"><div class="top">${payLabel(p)}, ${rangeLabel(p)}</div>
    <div class="fl"><span>Salary in${f.adjusted?" (adjusted)":""}</span><b class="num">${peso(f.salary)}</b></div>
    <div class="fl"><span>Spent so far</span><b class="num">−${peso(f.spent)}</b></div>
    <div class="fl"><span>Bills still due${f.dueN?" ("+f.dueN+")":""}</span><b class="num">−${peso(f.due)}</b></div>
    <div class="fl total"><span>Left after bills</span><b class="num ${f.left<0?"neg":""}">${f.left<0?"−":""}${peso(Math.abs(f.left))}</b></div>
    <div class="bar"><i style="width:${used}%;${f.left<0?"background:var(--danger)":""}"></i></div>
    <div class="foot">${started ? `Next payday ${fmtDate(np.start)}, ${days===1?"tomorrow":"in "+days+" days"}.` : `Tracking starts with your ${fmtDate(p.start)} pay, ${daysBetween(t,p.start)===1?"tomorrow":"in "+daysBetween(t,p.start)+" days"}.`} <button class="btn small ghost" style="padding:2px 4px" data-act="adjustPay" data-start="${p.start}">Adjust this pay</button></div>
  </div>
  <div class="list" style="margin-top:10px"><div class="row"><div class="grow"><div class="t">Next cutoff</div><div class="d">${payLabel(np)}, ${rangeLabel(np)} · ${peso(nf.salary)} in, ${peso(nf.due)} bills</div></div><div class="a num ${nf.left<0?"neg":""}">${nf.left<0?"−":""}${peso(Math.abs(nf.left))}<div class="d" style="text-align:right;font-weight:400">left</div></div></div></div>`;
}

/* ---------- views ---------- */
function viewHome(){
  const t = TODAY(), month = t.slice(0,7);
  const up = schedule(addDays(t,30), false);
  const next = up[0];
  const spent = S.expenses.filter(e=>e.date.startsWith(month)).reduce((a,e)=>a+Number(e.amount),0);
  const monthEnd = month+"-"+pad(dim(+month.slice(0,4), +month.slice(5)-1));
  const leftThisMonth = schedule(monthEnd,false).filter(x=>x.due.startsWith(month) || x.due < t).reduce((a,x)=>a+Number(x.b.amount),0);
  let h = "";
  const group = next ? up.filter(x => next.due < t ? x.due < t : x.due === next.due) : [];
  if (group.length > 1){
    const over = next.due < t;
    const total = group.reduce((a,x)=>a+Number(x.b.amount),0);
    const title = over ? group.length+" overdue payments" : group.length+" payments due";
    h += `<div class="stub multi ${over?"over":""}">
      <div class="hd"><div><div class="when">${over?"Overdue":relDue(next.due)+" · "+fmtDate(next.due)}</div><div class="name">${title}</div></div><div class="amt num">${peso(total)}</div></div>
      <div class="items">${group.map(x=>`<div class="it"><div class="n">${esc(x.b.name)}<small>${over?fmtDate(x.due)+" · ":""}${x.b.kind==="loan"?"Loan payment":"Bill"}</small></div><span class="num">${peso(x.b.amount)}</span><button data-act="pay" data-id="${x.b.id}" data-due="${x.due}">Pay</button></div>`).join("")}
      <button class="all" data-act="payAll" data-items="${group.map(x=>x.b.id+"|"+x.due).join(",")}">Mark all ${group.length} paid</button></div></div>`;
  } else if (next){
    const over = next.due < t;
    h += `<div class="stub ${over?"over":""}" style="--notch:${Math.max(118, peso(next.b.amount).length*17+36)}px">
      <div class="l"><div class="when">${relDue(next.due)} · ${fmtDate(next.due)}</div><div class="name">${esc(next.b.name)}</div><div class="when">${next.b.kind==="loan"?"Loan payment":"Bill"}</div></div>
      <div class="r"><div class="amt num">${peso(next.b.amount)}</div><button data-act="pay" data-id="${next.b.id}" data-due="${next.due}">Mark paid</button></div></div>`;
  } else if (!S.bills.length){
    h += `<div class="stub empty"><div class="l"><div class="name">No bills scheduled yet</div><div class="when">Add your loan and regular bills once. Bayad lays out every due date for you.</div><div class="actions"><button class="btn primary" data-act="addBill">Add a bill or loan</button></div></div></div>`;
  } else {
    h += `<div class="stub empty"><div class="l"><div class="name">All clear for 30 days</div><div class="when">Nothing unpaid is due before ${fmtDate(addDays(t,30))}.</div></div></div>`;
  }
  h += `<div class="actions"><button class="btn primary" data-act="addExp">Add expense</button><button class="btn" data-act="addBill">Add bill or loan</button></div>`;
  if (S.salary) h += flowCard();
  else {
    h += `<div class="stats"><div class="stat"><span>Spent in ${parse(t).toLocaleDateString("en-PH",{month:"long"})}</span><b class="num">${peso(spent)}</b></div><div class="stat"><span>Still to pay this month</span><b class="num">${peso(leftThisMonth)}</b></div></div>`;
    h += `<div class="flow" style="margin-top:12px"><b>Add your salary</b><div class="sub" style="margin:4px 0 10px">Enter your pay on the 5th and 20th to see what's left each cutoff after bills and spending.</div><button class="btn primary small" data-act="salary">Set salary</button></div>`;
  }

  const loans = S.bills.filter(b=>b.kind==="loan");
  if (loans.length){
    h += `<h2>Loans</h2><div class="list">` + loans.map(b=>{
      const L = loanInfo(b); const pct = L.terms ? L.paidN/L.terms*100 : 0;
      return `<button class="row tap" data-act="editBill" data-id="${b.id}"><div class="grow"><div class="t">${esc(b.name)}</div>
        <div class="d">${L.paidN} of ${L.terms} paid${L.next?" · next "+fmtDate(L.next):" · fully paid"}${L.last?" · ends "+parse(L.last).toLocaleDateString("en-PH",{month:"short",year:"numeric"}):""}</div>
        <div class="bar"><i style="width:${pct}%"></i></div></div><div class="a num">${peso(L.remaining)}<div class="d" style="text-align:right;font-weight:400">left</div></div></button>`;
    }).join("") + `</div>`;
  }
  const rest = up.filter(x => !group.includes(x));
  h += `<h2>Coming up</h2>`;
  h += rest.length ? `<div class="list">`+rest.map(dueRow).join("")+`</div>` : `<div class="list"><div class="empty-note">${S.bills.length?"Nothing else due in the next 30 days.":"Your upcoming due dates will show here."}</div></div>`;
  return h;
}
function dueRow(x){
  const over = !x.paid && x.due < TODAY();
  return `<div class="row ${x.paid?"paid":""}"><div class="grow"><div class="t">${esc(x.b.name)}${x.b.kind==="loan"?'<span class="tag">loan</span>':""}</div>

    <div class="a num">${peso(x.b.amount)}</div>
    ${x.paid?`<button class="btn small ghost" data-act="unpay" data-id="${x.b.id}" data-due="${x.due}">Undo</button>`:`<button class="btn small" data-act="pay" data-id="${x.b.id}" data-due="${x.due}">Pay</button>`}</div>`;
}

function viewExp(){
  const cut = S.salary && expMode === "cut";
  let p = null, inRange, label, emptyLabel;
  if (cut){
    p = periodOf(expCut || (S.trackFrom > TODAY() ? S.trackFrom : TODAY()));
    inRange = e => e.date >= p.start && e.date <= p.end;
    label = payLabel(p)+", "+rangeLabel(p); emptyLabel = "this cutoff";
  } else {
    inRange = e => e.date.startsWith(expMonth);
    label = fmtMonth(expMonth); emptyLabel = fmtMonth(expMonth);
  }
  const list = S.expenses.filter(inRange).sort((a,b)=>b.date.localeCompare(a.date) || (b.ts||0)-(a.ts||0));
  const total = list.reduce((a,e)=>a+Number(e.amount),0);
  const byCat = {};
  list.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+Number(e.amount));
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  let h = "";
  if (S.salary) h += `<div style="display:flex;justify-content:center;margin-bottom:10px"><div class="toggle" role="group" aria-label="View by"><button data-act="expMode" data-v="cut" aria-pressed="${cut}">By cutoff</button><button data-act="expMode" data-v="month" aria-pressed="${!cut}">By month</button></div></div>`;
  h += `<div class="monthnav"><button class="btn small" data-act="month" data-v="-1" aria-label="Previous">‹</button><b style="font-size:${cut?16:19}px;text-align:center">${label}</b><button class="btn small" data-act="month" data-v="1" aria-label="Next">›</button></div>`;
  if (cut){
    if (p.start < periodOf(S.trackFrom).start){
      h += `<div class="stats"><div class="stat"><span>Spent</span><b class="num">${peso(total)}</b></div><div class="stat"><span>Salary</span><b style="font-size:15px">Before tracking</b></div></div>`;
      h += `<div class="actions"><button class="btn primary" data-act="addExp">Add expense</button></div>`;
      return h + expList(list, emptyLabel, cats);
    }
    const sal = payAmt(p.start), left = sal - total;
    h += `<div class="stats three"><div class="stat"><span>Salary</span><b class="num">${peso(sal)}</b></div><div class="stat"><span>Spent</span><b class="num">${peso(total)}</b></div><div class="stat"><span>Left</span><b class="num ${left<0?"neg":""}">${left<0?"−":""}${peso(Math.abs(left))}</b></div></div>`;
  } else {
    h += `<div class="stats"><div class="stat"><span>Total spent</span><b class="num">${peso(total)}</b></div><div class="stat"><span>Entries</span><b class="num">${list.length}</b></div></div>`;
  }
  h += `<div class="actions"><button class="btn primary" data-act="addExp">Add expense</button></div>`;
  return h + expList(list, emptyLabel, cats);
}
function expList(list, emptyLabel, cats){
  let h = "";
  if (cats.length){
    h += `<h2>By category</h2><div class="list cats">`+cats.map(([c,v])=>`<div class="row"><div class="line1"><span>${esc(c)}</span><span class="num">${peso(v)}</span></div><div class="bar"><i style="width:${v/cats[0][1]*100}%"></i></div></div>`).join("")+`</div>`;
  }
  h += `<h2>Entries</h2>${list.length?'<p class="sub" style="margin:-4px 0 8px">Tap an entry to edit or delete it.</p>':""}`;
  if (!list.length) return h + `<div class="list"><div class="empty-note">No expenses logged for ${emptyLabel}. Paying a bill here adds it automatically.</div></div>`;
  h += `<div class="list">`;
  for (const e of list){
    h += `<button class="row tap" data-act="editExp" data-id="${e.id}"><div class="grow"><div class="t">${esc(e.note || e.cat)}</div><div class="d">${fmtDate(e.date)} · ${esc(e.cat)}${e.billId?" · from schedule":""}</div></div><div class="a num">${peso(e.amount)}</div></button>`;
  }
  return h + `</div>`;
}

function viewBills(){
  let h = `<h2>Income</h2><div class="list"><button class="row tap" data-act="salary"><div class="grow"><div class="t">Salary</div><div class="d">${S.salary?"Paid on the 5th and 20th · counting from "+fmtDate(S.trackFrom):"Set your pay for the 5th and 20th"}</div></div><div class="a num">${S.salary?peso(S.salary.a5)+" / "+peso(S.salary.a20):"Set"}</div></button></div>`;
  h += `<div class="head"><h2>Bills &amp; loans</h2><button class="btn primary small" data-act="addBill">Add</button></div>`;
  if (!S.bills.length) return h + `<div class="list"><div class="empty-note">Add a loan with its monthly amortization and number of payments, or a bill like electricity or internet. Each due date is scheduled automatically.</div></div>`;
  const t = TODAY();
  h += `<div class="list">`+[...S.bills].sort((a,b)=>(a.kind===b.kind?0:a.kind==="loan"?-1:1)||a.name.localeCompare(b.name)).map(b=>{
    let extra = "";
    if (b.kind === "loan"){ const L = loanInfo(b); extra = `<div class="d">${L.paidN} of ${L.terms} paid · ${peso(L.remaining)} left</div><div class="bar"><i style="width:${L.terms?L.paidN/L.terms*100:0}%"></i></div>`; }
    else { const nx = occurrences(b, addDays(t,400)).find(d=>d >= S.trackFrom && !b.paid[d]); extra = `<div class="d">${nx?"Next: "+fmtDate(nx):"No upcoming dates"}</div>`; }
    return `<button class="row tap" data-act="editBill" data-id="${b.id}"><div class="grow"><div class="t">${esc(b.name)}${b.kind==="loan"?'<span class="tag">loan</span>':""}</div><div class="d">${freqText(b)}</div>${extra}</div><div class="a num">${peso(b.amount)}</div></button>`;
  }).join("")+`</div>`;
  const sched = schedule(addDays(t,60), true).filter(x => !x.paid || x.due >= addDays(t,-31));
  h += `<h2>Schedule, next 60 days</h2>${S.salary?`<p class="sub" style="margin:-4px 0 6px">Grouped by the paycheck that covers each bill.</p>`:""}`;
  if (!sched.length) return h + `<div class="list"><div class="empty-note">No due dates in this window.</div></div>`;
  const groups = {};
  const starts = {};
  sched.forEach(x=>{
    let k;
    if (x.due < t && !x.paid) k = "Overdue";
    else if (S.salary){ const p = periodOf(x.due); k = payLabel(p)+", "+rangeLabel(p); starts[k] = p.start; }
    else k = fmtMonth(x.due.slice(0,7));
    (groups[k]=groups[k]||[]).push(x);
  });
  for (const [k,items] of Object.entries(groups)){
    const sum = items.filter(x=>!x.paid).reduce((a,x)=>a+Number(x.b.amount),0);
    const right = starts[k] ? `${peso(sum)} due of ${peso(payAmt(starts[k]))}` : `${peso(sum)} unpaid`;
    h += `<div class="head" style="margin:14px 2px 6px"><b style="font-weight:600">${k}</b><span class="sub num">${right}</span></div><div class="list">`+items.map(dueRow).join("")+`</div>`;
  }
  return h;
}

/* ---------- owed to me (separate from personal totals) ---------- */
function debtInfo(d){
  const paid = d.payments.reduce((a,p)=>a+Number(p.amount),0);
  const last = d.payments.map(p=>p.date).sort().pop();
  return {paid, left: Math.max(0, Number(d.amount) - paid), done: paid >= Number(d.amount) - 0.005, last};
}
function viewOwed(){
  let h = `<div class="head"><h2>Owed to me</h2><button class="btn primary small" data-act="addDebt">Add</button></div>
    <p class="worknote">People who borrowed from you. Kept separate from your expenses and cutoffs.</p>`;
  if (!S.debts.length) return h + `<div class="flow"><b>No one owes you yet</b><div class="sub" style="margin:4px 0 10px">Add who borrowed, how much and when. Tap Paid when they pay you back, full or partial, and pick the date.</div><button class="btn primary small" data-act="addDebt">Add someone</button></div>`;
  const t = TODAY();
  const rows = S.debts.map(d=>({d, i:debtInfo(d)}));
  const open = rows.filter(x=>!x.i.done).sort((a,b)=>(a.d.due||a.d.date).localeCompare(b.d.due||b.d.date));
  const done = rows.filter(x=>x.i.done).sort((a,b)=>(b.i.last||"").localeCompare(a.i.last||""));
  const outstanding = open.reduce((a,x)=>a+x.i.left,0);
  const people = new Set(open.map(x=>x.d.name.trim().toLowerCase())).size;
  const collected = rows.reduce((a,x)=>a+x.i.paid,0);
  h += `<div class="flow"><div class="top">Still owed to you</div><div class="fl total" style="border:0;margin:0;padding:0"><b class="num">${peso(outstanding)}</b></div>
    <div class="foot">${people ? "From "+people+(people===1?" person":" people") : "Everyone has paid you back"} · ${peso(collected)} collected so far</div></div>`;
  h += `<h2>Not yet paid</h2>`;
  h += open.length ? `<div class="list">`+open.map(({d,i})=>{
    const over = d.due && d.due < t;
    return `<div class="row"><div class="grow"><div class="t">${esc(d.name)}</div>
      <div class="d">${d.note?esc(d.note)+" · ":""}Lent ${fmtDate(d.date)}${d.due?` · <span class="${over?"over d":""}" style="${over?"font-weight:600":""}">${over?"was due ":"due "}${fmtDate(d.due)}</span>`:""}</div>
      ${i.paid?`<div class="d">${peso(i.paid)} of ${peso(d.amount)} paid, last on ${fmtDate(i.last)}</div>`:""}</div>
      <div class="a num">${peso(i.left)}</div>
      <div class="btns"><button class="btn small primary" data-act="payDebt" data-id="${d.id}">Paid</button><button class="btn small" data-act="editDebt" data-id="${d.id}">Edit</button></div></div>`;
  }).join("")+`</div>` : `<div class="list"><div class="empty-note">Nothing outstanding.</div></div>`;
  if (done.length){
    h += `<h2>Paid back</h2><div class="list">`+done.map(({d,i})=>`<div class="row done"><div class="grow"><div class="t">${esc(d.name)}</div>
      <div class="d">${d.note?esc(d.note)+" · ":""}Paid in full ${fmtDate(i.last)}${d.payments.length>1?" ("+d.payments.length+" payments)":""}</div></div>
      <div class="a num" style="color:var(--muted)">${peso(d.amount)}</div><button class="btn small" data-act="editDebt" data-id="${d.id}">Edit</button></div>`).join("")+`</div>`;
  }
  return h;
}
function debtSheet(d){
  const isNew = !d;
  const v = d || {name:"", amount:"", date:TODAY(), due:"", note:""};
  const hist = d && d.payments.length ? `<div style="margin:4px 0 12px"><span class="sub" style="font-weight:500">Payments received</span><div class="payhist">${[...d.payments].sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<div class="row"><div class="grow">${fmtDate(p.date)}, ${parse(p.date).getFullYear()}</div><div class="a num">${peso(p.amount)}</div><button type="button" class="x" data-rmpay="${p.id}" aria-label="Remove payment">×</button></div>`).join("")}</div></div>` : "";
  openSheet(isNew?"Someone owes you":"Edit "+esc(d.name), `
    ${field("Name", `<input name="name" required maxlength="50" value="${esc(v.name)}" placeholder="e.g. Mark">`)}
    <div class="two">${field("Amount (₱)", `<input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${esc(v.amount)}">`)}${field("Date lent", `<input name="date" type="date" required value="${esc(v.date)}">`)}</div>
    <div class="two">${field("Promised to pay by (optional)", `<input name="due" type="date" value="${esc(v.due||"")}">`)}${field("Note (optional)", `<input name="note" maxlength="60" value="${esc(v.note||"")}" placeholder="e.g. gas money">`)}</div>
    ${hist}`,
    isNew?"Add":"Save changes", fd=>{
      const vals = {name:fd.name.trim(), amount:Number(fd.amount), date:fd.date, due:fd.due||"", note:fd.note.trim()};
      if (isNew) S.debts.push({id:uid(), payments:[], ...vals}); else Object.assign(d, vals);
      commit(); toast(isNew?"Added":"Changes saved");
    }, isNew?"":`<button type="button" class="btn danger left" id="delDebt">Delete</button>`);
  if (!isNew){
    $("#delDebt").onclick = () => { if (confirm("Delete this record for "+d.name+"?")){ S.debts = S.debts.filter(x=>x.id!==d.id); commit(); $("#sheet").close(); toast("Deleted"); } };
    $("#sheetForm").querySelectorAll("[data-rmpay]").forEach(b=>b.onclick = () => {
      const p = d.payments.find(x=>x.id===b.dataset.rmpay);
      if (!p || !confirm("Remove the "+peso(p.amount)+" payment on "+fmtDate(p.date)+"?")) return;
      d.payments = d.payments.filter(x=>x.id!==p.id); commit(); b.closest(".row").remove(); toast("Payment removed");
    });
  }
}
function payDebtSheet(d){
  if (!d) return;
  const i = debtInfo(d), t = TODAY();
  openSheet(esc(d.name)+" paid you", `<p class="hint" style="margin:0 0 12px">${peso(i.left)} still owed${i.paid?" ("+peso(i.paid)+" already paid)":""}. Enter less for a partial payment.</p>
    <div class="two">${field("Date received", `<input name="date" type="date" required max="${t}" value="${t}">`)}${field("Amount (₱)", `<input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${i.left.toFixed(2)}">`)}</div>`,
    "Record payment", fd=>{
      d.payments.push({id:uid(), date:fd.date, amount:Number(fd.amount)});
      commit(); toast(debtInfo(d).done ? d.name+" paid in full" : "Partial payment recorded");
    });
}

function viewWork(){
  let h = `<div class="head"><h2>Work fund</h2><button class="btn small" data-act="addFund">New fund</button></div>
    <p class="worknote">Kept separate from your personal money. Nothing here counts toward your expenses or bills.</p>`;
  if (!S.funds.length) return h + `<div class="fund"><div class="lbl">No work fund yet</div><p style="margin:6px 0 0">Record money your office handed you, like a ₱5,000 cash advance, then log where every peso went for liquidation.</p><div class="actions"><button class="btn primary" data-act="addFund">Add work fund</button></div></div>`;
  let f = S.funds.find(x=>x.id===S.activeFund) || S.funds[S.funds.length-1];
  if (S.funds.length > 1) h += `<div class="chips">`+S.funds.map(x=>`<button class="chip" data-act="pickFund" data-id="${x.id}" aria-pressed="${x.id===f.id}">${esc(x.name)}</button>`).join("")+`</div>`;
  const spent = f.entries.reduce((a,e)=>a+Number(e.amount),0);
  const left = Number(f.amount) - spent;
  const pct = f.amount ? Math.min(100, spent/f.amount*100) : 0;
  h += `<div class="fund"><div class="head"><div class="lbl">${esc(f.name)} · received ${fmtDate(f.date)}</div><button class="btn small ghost" data-act="editFund" data-id="${f.id}">Edit</button></div>
    <div class="big num">${peso(Math.max(0,left))}</div><div class="sub num">remaining · ${peso(spent)} used of ${peso(f.amount)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${left<0?`<div class="warn num">Over by ${peso(-left)}. That's your own money covering work costs; claim it back.</div>`:""}
    <div class="actions"><button class="btn primary" data-act="addEntry" data-id="${f.id}">Log where it went</button><button class="btn" data-act="exportFund" data-id="${f.id}">Liquidation (CSV)</button></div></div>`;
  h += `<h2>Where it went</h2>`;
  const ents = [...f.entries].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  if (!ents.length) return h + `<div class="list"><div class="empty-note">No spending logged against this fund yet.</div></div>`;
  return h + `<div class="list">`+ents.map(e=>`<div class="row"><div class="grow"><div class="t">${esc(e.purpose)}</div><div class="d">${fmtDate(e.date)}${e.receipt?" · OR# "+esc(e.receipt):" · no receipt"}</div></div><div class="a num">${peso(e.amount)}</div><button class="btn small" data-act="editEntry" data-fund="${f.id}" data-id="${e.id}" aria-label="Edit ${esc(e.purpose)}">Edit</button></div>`).join("")+`</div>`;
}

function payOne(id, due, date, amount){
  const b = S.bills.find(x=>x.id===id); if (!b || b.paid[due]) return false;
  const eid = uid();
  b.paid[due] = eid;
  S.expenses.push({id:eid, ts:Date.now(), date:date||TODAY(), amount:amount>0?amount:Number(b.amount), cat:b.cat||(b.kind==="loan"?"Loan":"Bills"), note:b.name+" ("+fmtDate(due)+" due)", billId:b.id, due});
  return true;
}

async function saveFile(name, text, mime){
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl){ await dl.save({filename:name, data:text}); return true; }
  } catch(err){ if (err && err.code==="declined") return true; }
  if (window.claude) return false;
  const blob = new Blob([text], {type:mime});
  try {
    const file = new File([blob], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return true; }
  } catch(err){ if (err && err.name==="AbortError") return true; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); return true;
  } catch(err){ return false; }
}

/* ---------- persistence: account (private to you) with device fallback ---------- */
let docRef = null, saving = false, dirty = false, saveT = null;
function setSync(mode){ $("#sync").textContent = mode==="cloud" ? "Synced to your account" : mode==="saving" ? "Saving…" : "Saved on this phone"; }
function saveLocal(){ try { localStorage.setItem("bayad-state", JSON.stringify(S)); } catch(e){} }
function commit(){ render(); saveLocal(); if (docRef){ dirty = true; setSync("saving"); clearTimeout(saveT); saveT = setTimeout(flush, 700); } }
async function flush(){
  if (!docRef) return;
  if (saving){ saveT = setTimeout(flush, 400); return; }
  saving = true; dirty = false;
  try { await docRef.set({state: JSON.parse(JSON.stringify(S)), updatedAt: new Date().toISOString()}); if (!dirty) setSync("cloud"); }
  catch(e){ if (e && e.code==="unavailable"){ dirty = true; setTimeout(flush, 1500+Math.random()*1000); } else { docRef = null; setSync("device"); } }
  saving = false;
}
const hasData = s => s.expenses.length || s.bills.length || s.funds.length;
async function initCloud(){
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/"+id+"/state");
    let first = true;
    ref.onSnapshot(snap=>{
      if (snap.exists){
        const data = snap.data();
        if (data && data.state && !dirty && !saving && !snap.metadata.hasPendingWrites && JSON.stringify(data.state) !== JSON.stringify(S)){
          S = normalize(JSON.parse(JSON.stringify(data.state))); saveLocal(); render();
        }
      } else if (first && hasData(S)){ dirty = true; saveT = setTimeout(flush, 300); }
      first = false;
      if (!dirty && !saving) setSync("cloud");
    }, ()=>{ docRef = null; setSync("device"); });
    docRef = ref;
  } catch(e){ setSync("device"); }
}

/* ---------- auto-update: upload a new index.html to GitHub and the phone picks it up ---------- */
const APP_VERSION = "2.1";
let swReg = null;
if ("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").then(r=>{ swReg = r; }).catch(()=>{}));
async function checkForUpdate(){
  if (!navigator.onLine) return;
  try {
    if (swReg) swReg.update().catch(()=>{});
    const r = await fetch("index.html?check="+Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const m = (await r.text()).match(/name="bayad-version" content="([^"]+)"/);
    if (!m || m[1] === APP_VERSION) return;
    let tried = null; try { tried = sessionStorage.getItem("bayad-reloaded-for"); } catch(e){}
    if (!$("#sheet").open && tried !== m[1]){
      try { sessionStorage.setItem("bayad-reloaded-for", m[1]); } catch(e){}
      location.reload();
    } else showUpdateBar(m[1]);
  } catch(e){}
}
function showUpdateBar(v){
  if ($("#updateBar")) return;
  const bar = document.createElement("div");
  bar.className = "update"; bar.id = "updateBar"; bar.setAttribute("role","status");
  bar.innerHTML = "<span>Bayad "+esc(v)+" is ready</span><button type=\"button\">Update now</button>";
  bar.querySelector("button").onclick = () => location.reload();
  document.body.appendChild(bar);
}
checkForUpdate();
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible") checkForUpdate(); });
window.addEventListener("online", checkForUpdate);
$("#ver").textContent = "v"+APP_VERSION;
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
// refresh "due in" labels when the day changes
setInterval(()=>{ if (!$("#sheet").open) render(); }, 60*60*1000);
</script>
</body>
